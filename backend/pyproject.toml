[project]
name = "floodsense-backend"
version = "0.1.0"
description = "FloodSense backend: Strands agent, flood-risk scoring, API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "strands-agents>=1.59.0",
    "strands-agents-tools>=0.8.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodsense"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
